server.port=${SERVER_PORT:8080}

# MySQL by default. Change with environment variables, or use the h2 profile (no install needed).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/os_diagnostic_engine?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:osdiag}
spring.datasource.password=${DB_PASSWORD:osdiag_password}

# Hibernate creates the tables from the entity classes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# History: the live screen reads every 3 seconds, the database gets one sample per interval.
# Detailed samples older than the retention are deleted (0 keeps them forever). Scans, cleanups and security history are never deleted.
app.history.sample-interval-ms=${HISTORY_SAMPLE_INTERVAL_MS:30000}
app.history.retention-days=${HISTORY_RETENTION_DAYS:30}

# The scripts set OPEN_BROWSER=true so the dashboard opens by itself.
app.open-browser=${OPEN_BROWSER:false}

# Many PCs cannot report the processor temperature. That is fine, the screen shows Unavailable.
logging.level.oshi.util.platform.windows.WmiQueryHandler=ERROR
