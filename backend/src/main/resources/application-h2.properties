# Optional profile for machines without MySQL:
#   mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Data is stored in a file in your home folder, so history survives restarts.
spring.datasource.url=jdbc:h2:file:${user.home}/.os-diagnostic-engine/osdiag-db;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
